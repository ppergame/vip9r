# Threaded-wasm build (M6). Stable cargo honors [unstable] only when
# RUSTC_BOOTSTRAP=1 is in cargo's own environment (devshell, wrappers, and
# harness scripts all export it). Without it the build fails loudly at link
# time: prebuilt core objects reject --shared-memory.
#
# build-std=core: core must be compiled with +atomics,+bulk-memory for the
# shared-memory link. compiler-builtins-mem is not needed: with +bulk-memory
# LLVM lowers memcpy/memset intrinsics to memory.copy/memory.fill, and the
# linked module has no memcpy import (verified 2026-07-03, rustc 1.96.0).
#
# Memory is pinned at link time: --initial-memory == --max-memory == 64 MiB,
# so the memory import declares min == max. V8 caches the shared-memory size
# only for declared-non-growable limits; growable limits cost +5%/+8.5% frame
# time on the A55 (docs/design.md, Threads). The wasm code still sizes itself
# dynamically (vip9r_required_pages, ensure_memory) — the 1024-page ceiling is
# policy, pinned by the corpus_ceiling_fits_fixed_memory wasm test (corpus max
# 1080p needs 669 pages incl. packet tail). Every frontend creates the shared
# WebAssembly.Memory at exactly 1024 pages: a min == max declaration matches
# no other shape, so drift from this value fails instantiation loudly. V8
# reserves the full 64 MiB upfront for shared memories — fine on arm32, and
# physical pages materialize on first touch.
#
# Shadow stacks (threads), fixed-address layout: coordinator stack 0..1MiB
# (rustc's default --stack-first; -zstack-size pins the size explicitly),
# worker stacks fixed at 1..4MiB, and --global-base pushes the data section to
# 4MiB to keep that region clear. Worker stack tops (0x200000 / 0x300000 /
# 0x400000) are therefore ABI constants: JS rebinds each worker instance right
# after instantiation via the exported __stack_pointer global
# (instance.exports.__stack_pointer.value = top) without executing any wasm —
# the only code that runs earlier is lld's stack-free __wasm_init_memory.
# arena_bounds in wasm.rs asserts __heap_base >= 4MiB, so dropping
# --global-base fails loudly at init.

[build]
target = "wasm32-unknown-unknown"

[unstable]
build-std = ["core"]

[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "panic=abort",
  "-C", "target-feature=+simd128,+atomics,+bulk-memory",
  "-C", "link-arg=--shared-memory",
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--export-memory",
  "-C", "link-arg=--initial-memory=67108864",
  "-C", "link-arg=--max-memory=67108864",
  "-C", "link-arg=-zstack-size=1048576",
  "-C", "link-arg=--global-base=4194304",
  "-C", "link-arg=--export=__stack_pointer",
]
