[workspace]
members = [
  "crates/vip9r",
  "crates/vip9r-tools",
]
default-members = [
  "crates/vip9r",
  "crates/vip9r-tools",
]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
overflow-checks = true
