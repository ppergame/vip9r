<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vip9r</title>
    <style>
      :root {
        --bg: #0e1014;
        --panel: #16181c;
        --well: #101216;
        --border: #262a31;
        --border-soft: #1d2026;
        --ink: #d6d8dc;
        --ink-muted: #8b8f97;
        --accent: #3987e5;
        --accent-hover: #4a95ee;
        --error: #ff7b72;
        --radius: 8px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 0.9375rem;
        line-height: 1.4;
        background: var(--bg);
        color: var(--ink);
        /* Viewport-fit: the page never scrolls; the log pane scrolls itself. */
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.625rem;
        padding: 0.4375rem 1.25rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-family: ui-monospace, monospace;
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0;
      }
      header h1::first-letter {
        color: var(--accent);
      }
      .tagline {
        color: var(--ink-muted);
        font-size: 0.8125rem;
        margin-right: 0.75rem;
        border-left: 1px solid var(--border);
        padding-left: 0.875rem;
      }
      .repo-link {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        color: var(--ink);
        text-decoration: none;
        font-size: 0.8125rem;
        padding: 0.3125rem 0.75rem;
        background: var(--well);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .repo-link:hover {
        color: var(--accent-hover);
        border-color: var(--accent);
      }
      .repo-link svg {
        width: 1rem;
        height: 1rem;
        fill: currentColor;
      }
      select,
      input,
      button {
        font: inherit;
        background: var(--well);
        color: inherit;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.3125rem 0.625rem;
      }
      select:hover,
      button:hover {
        border-color: #3a4048;
      }
      button {
        cursor: pointer;
      }
      button:active {
        background: #191c22;
      }
      select:focus-visible,
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 500;
        padding-inline: 1rem;
      }
      button.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      button.primary:active {
        background: #2e75cc;
      }
      input#media-url {
        width: 24rem;
        max-width: 60vw;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 0.625rem 1.25rem 0;
      }
      nav.tabs {
        display: inline-flex;
        gap: 0.25rem;
        padding: 0.25rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      nav.tabs button {
        background: transparent;
        border: none;
        border-radius: calc(var(--radius) - 3px);
        padding: 0.25rem 1.125rem;
        color: var(--ink-muted);
      }
      nav.tabs button:hover {
        color: var(--ink);
      }
      /* Selected tab is a neutral raised chip; blue is reserved for the
         start button so state and action stay visually distinct. */
      nav.tabs button.active {
        background: var(--border);
        color: var(--ink);
      }
      section.mode {
        margin: 0.625rem 1.25rem;
        padding: 0.625rem;
        background: var(--panel);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      /* hidden must beat the display: flex on sections and controls. */
      [hidden] {
        display: none !important;
      }
      /* Bench has no tall content: shrink the panel to fit and hand the
         leftover space to the log. */
      #bench:not([hidden]) {
        flex: 0 0 auto;
      }
      #bench:not([hidden]) ~ #log {
        height: auto;
        flex: 1;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }
      #play-stats {
        color: var(--ink-muted);
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }
      canvas.spark {
        display: block;
        width: 100%;
        height: 36px;
        margin-bottom: 0.625rem;
        background: var(--well);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 3px);
      }
      .lanes {
        display: flex;
        gap: 1rem;
        flex: 1;
        min-height: 0;
      }
      .lane {
        flex: 1 1 20rem;
        min-width: 16rem;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .lane figcaption {
        margin-bottom: 0.25rem;
        color: var(--ink-muted);
        font-size: 0.8125rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .lane canvas {
        /* Height comes from the flex column; width follows the canvas's
           intrinsic aspect ratio so the border hugs the video. */
        flex: 1;
        min-height: 0;
        width: auto;
        max-width: 100%;
        align-self: center;
        object-fit: contain;
        background: #000;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 3px);
        display: block;
      }
      label {
        color: var(--ink-muted);
        font-size: 0.85rem;
      }
      input#frames {
        width: 5rem;
      }
      #bench-results {
        padding: 0.375rem 0.875rem;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
        background: var(--well);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 3px);
        min-height: 4.5rem;
        overflow: auto;
      }
      #bench-results table {
        width: 100%;
        border-collapse: collapse;
      }
      #bench-results th,
      #bench-results td {
        text-align: left;
        white-space: nowrap;
        padding: 0.4375rem 1.25rem 0.4375rem 0;
      }
      #bench-results th {
        color: var(--ink-muted);
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      #bench-results tbody td {
        border-top: 1px solid var(--border-soft);
      }
      #bench-results .num {
        text-align: right;
      }
      #bench-results .bar-cell {
        width: 30%;
      }
      #bench-results .track {
        position: relative;
        display: flex;
        align-items: center;
        height: 0.875rem;
      }
      #bench-results .bar {
        height: 8px;
        min-width: 2px;
        border-radius: 4px;
        background: var(--accent);
      }
      #bench-results .bar.under {
        background: var(--error);
      }
      #bench-results .tick {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        margin-left: -1px;
        background: var(--ink-muted);
      }
      #bench-results .skip,
      #bench-results .notes {
        color: var(--ink-muted);
      }
      #log {
        margin: 0 1.25rem 0.625rem;
        padding: 0.625rem 0.75rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8125rem;
        line-height: 1.5;
        color: var(--ink-muted);
        background: var(--well);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        height: 6rem;
        flex-shrink: 0;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      #log .error {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>vip9r</h1>
      <span class="tagline">wasm vp9 decoder</span>
      <select id="media-select"></select>
      <input
        id="media-url"
        type="text"
        placeholder="https://…/clip.webm"
        hidden
      />
      <a
        class="repo-link"
        href="https://github.com/ppergame/vip9r#vip9r"
        target="_blank"
        rel="noopener"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
        source, notes, fun facts
      </a>
    </header>
    <div class="toolbar">
      <nav class="tabs">
        <button id="tab-play">play</button>
        <button id="tab-bench">bench</button>
      </nav>
      <div id="play-controls" class="controls" hidden>
        <button id="play-start" class="primary">start</button>
        <span id="play-stats"></span>
      </div>
      <div id="bench-controls" class="controls" hidden>
        <button id="bench-start" class="primary">start</button>
        <label>
          frames:
          <input id="frames" type="number" min="0" />
        </label>
      </div>
    </div>
    <section id="play" class="mode" hidden>
      <canvas id="play-spark" class="spark"></canvas>
      <div class="lanes">
        <figure class="lane">
          <figcaption>vip9r</figcaption>
          <canvas id="play-canvas"></canvas>
        </figure>
      </div>
    </section>
    <section id="bench" class="mode" hidden>
      <div id="bench-results"></div>
    </section>
    <div id="log"></div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
