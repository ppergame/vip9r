<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vip9r</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #16181c;
        color: #d6d8dc;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid #33363c;
      }
      header h1 {
        font-size: 1rem;
        margin: 0 0.5rem 0 0;
      }
      select,
      input,
      button {
        font: inherit;
        background: #22252b;
        color: inherit;
        border: 1px solid #44484f;
        border-radius: 4px;
        padding: 0.25rem 0.5rem;
      }
      input#media-url {
        width: 24rem;
        max-width: 60vw;
      }
      nav.tabs {
        display: flex;
        gap: 0.25rem;
        padding: 0.5rem 1rem 0;
      }
      nav.tabs button {
        border-radius: 4px 4px 0 0;
        border-bottom: none;
      }
      nav.tabs button.active {
        background: #2e5db3;
        border-color: #2e5db3;
        color: #fff;
      }
      section.mode {
        padding: 1rem;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .lanes {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .lane {
        flex: 1 1 20rem;
        min-width: 16rem;
      }
      .lane figcaption {
        margin-bottom: 0.25rem;
        color: #9a9da3;
      }
      .lane canvas {
        width: 100%;
        height: auto;
        aspect-ratio: auto 16 / 9;
        background: #000;
        border: 1px solid #33363c;
        display: block;
      }
      #log {
        margin: 0 1rem 1rem;
        padding: 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        background: #101216;
        border: 1px solid #33363c;
        max-height: 14rem;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      #log .error {
        color: #ff7b72;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>vip9r</h1>
      <select id="media-select"></select>
      <input id="media-url" type="text" placeholder="https://…/clip.webm" hidden />
      <button id="copy-link">copy link</button>
    </header>
    <nav class="tabs">
      <button id="tab-play">play</button>
      <button id="tab-race">race</button>
    </nav>
    <section id="play" class="mode" hidden>
      <div class="controls">
        <button id="play-start">start</button>
        <span id="play-stats"></span>
      </div>
      <div class="lanes">
        <figure class="lane">
          <figcaption>vip9r</figcaption>
          <canvas id="play-canvas"></canvas>
        </figure>
      </div>
    </section>
    <section id="race" class="mode" hidden>
      <div class="controls">
        <button id="race-start">start</button>
        <label>
          webcodecs:
          <select id="wc">
            <option value="software">software</option>
            <option value="hardware">hardware</option>
            <option value="auto">auto</option>
          </select>
        </label>
        <label>
          lanes:
          <select id="lanes">
            <option value="both">both</option>
            <option value="vip9r">vip9r only</option>
            <option value="webcodecs">webcodecs only</option>
          </select>
        </label>
      </div>
      <div class="lanes">
        <figure class="lane">
          <figcaption>vip9r</figcaption>
          <canvas id="race-canvas-vip9r"></canvas>
        </figure>
        <figure class="lane">
          <figcaption>webcodecs</figcaption>
          <canvas id="race-canvas-webcodecs"></canvas>
        </figure>
      </div>
    </section>
    <div id="log"></div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
